<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Clinical Trial Explorer — Osteosarcoma Now</title>
    <meta
      name="description"
      content="A curated database of osteosarcoma clinical trials. ClinicalTrials.gov is monitored daily, relevant studies are rewritten in plain language, and every uncertain case is reviewed by the Osteosarcoma Now editorial team."
    />
    <meta name="theme-color" content="#2563a8" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Social preview. og:image and og:url must be ABSOLUTE URLs for most
      scrapers (Twitter/X rejects relative ones outright), so these need the
      deployed origin prefixed once the domain is settled.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Osteosarcoma Now" />
    <meta property="og:title" content="Osteosarcoma Clinical Trial Explorer" />
    <meta
      property="og:description"
      content="A curated database of osteosarcoma clinical trials, monitored daily and reviewed by the Osteosarcoma Now editorial team."
    />
    <meta property="og:image" content="/osn-bardo-logo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Osteosarcoma Clinical Trial Explorer" />
    <meta
      name="twitter:description"
      content="A curated database of osteosarcoma clinical trials, monitored daily and reviewed by the Osteosarcoma Now editorial team."
    />
    <meta name="twitter:image" content="/osn-bardo-logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
